name: Deploy Medicine Web

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy-medicine-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
    defaults:
      run:
        working-directory: apps/medicine-web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/medicine-web/package-lock.json

      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: apps/medicine-web/.next/cache
          key: ${{ runner.os }}-next-lint-v1-${{ hashFiles('apps/medicine-web/package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-next-lint-v1-${{ hashFiles('apps/medicine-web/package-lock.json') }}-
            ${{ runner.os }}-next-${{ hashFiles('apps/medicine-web/package-lock.json') }}-

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Install dependencies
        run: npm ci

      - name: Generate web DB
        run: npm run sync:data

      - name: Lint
        # Content hashes survive checkout timestamps; dependency changes get a new cache.
        run: npm run lint -- --cache --cache-strategy content --cache-location .next/cache/eslint/

      - name: Verify lab workspace
        run: node --test scripts/test-lab-workbench.mjs

      - name: Verify learning sync
        run: node --test scripts/test-learning-sync.mjs

      - name: Verify question sessions
        run: node --test scripts/test-qbank-session-results.mjs

      - name: Verify interactive physiology
        run: npm run verify:physiology

      - name: Build static site
        run: npm run build -- --webpack

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/medicine-web/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
